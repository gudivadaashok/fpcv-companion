name: Check and deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check.mjs
        env: { STRICT: "1" }
  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site
          cp index.html site.css common.js _site/
          cp -r vendor _site/
          for f in $(grep -o '"[a-z-]*\.html"' common.js | tr -d '"' | sort -u); do cp "$f" _site/; done
          touch _site/.nojekyll
          # cache-bust shared assets: the CDN tells browsers to keep them for hours
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"(site\.css|common\.js|vendor/katex/katex\.min\.(css|js))\"#\1=\"\2?v=$v\"#g" _site/*.html
          if grep -lE '(href|src)="(site\.css|common\.js|vendor/katex/katex\.min\.(css|js))"' _site/*.html; then echo "unversioned asset refs remain"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
